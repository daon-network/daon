[package]
name = "daon-provenance-verify-wasm"
version = "0.0.0"          # not published; the wire format is not frozen yet
description = "A C ABI over the verifier, so it can be called from outside Rust"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# cdylib for the wasm artifact; rlib so the tests can call the same functions.
crate-type = ["cdylib", "rlib"]

[dependencies]
daon-provenance-core.workspace = true
daon-provenance-verify = { path = "../verify" }

[dev-dependencies]
ed25519-dalek = { workspace = true, features = ["rand_core"] }
