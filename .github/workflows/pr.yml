name: Pull Request Checks

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # Detect which areas of the repo changed so downstream jobs can self-select
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api_server: ${{ steps.filter.outputs.api_server }}
      frontend:   ${{ steps.filter.outputs.frontend }}
      blockchain: ${{ steps.filter.outputs.blockchain }}
      sdk_go:     ${{ steps.filter.outputs.sdk_go }}
      sdk_node:   ${{ steps.filter.outputs.sdk_node }}
      sdk_python: ${{ steps.filter.outputs.sdk_python }}
      sdk_ruby:   ${{ steps.filter.outputs.sdk_ruby }}
      sdk_php:    ${{ steps.filter.outputs.sdk_php }}
      provenance: ${{ steps.filter.outputs.provenance }}
      wordpress:  ${{ steps.filter.outputs.wordpress }}
      ccc:        ${{ steps.filter.outputs.ccc }}
      docs:       ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api_server:
              - 'api-server/**'
            frontend:
              - 'daon-frontend/**'
            blockchain:
              - 'daon-core/**'
            sdk_go:
              - 'sdks/go/**'
            sdk_node:
              - 'sdks/node/**'
            sdk_python:
              - 'sdks/python/**'
            sdk_ruby:
              - 'sdks/ruby/**'
            sdk_php:
              - 'sdks/php/**'
            # The Rust crates and the Python reference encoder are one unit: a
            # change to either can fork the wire format, so both trigger the
            # cross-implementation check.
            provenance:
              - 'provenance/**'
              - 'scripts/provenance/**'
            wordpress:
              - 'wordpress-plugin/**'
            ccc:
              - 'creative-commons-chain/**'
            # The docs site deploys straight from main:/docs via GitHub Pages'
            # legacy Jekyll builder, so merge is publish and there is no staging
            # step. A build error would surface only after merge, with the live
            # site quietly serving the last good build.
            docs:
              - 'docs/**'

  # ── API Server ────────────────────────────────────────────────────────────

  security:
    name: Security Audit
    needs: changes
    if: needs.changes.outputs.api_server == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: api-server/package-lock.json
      - run: cd api-server && npm ci
      - name: Run security audit
        run: |
          cd api-server
          npm audit --audit-level moderate
          if [ $? -ne 0 ]; then
            echo "Security vulnerabilities found - check details above"
            echo "High/Critical vulnerabilities will block deployment"
          fi

  test:
    name: API Tests (Node ${{ matrix.node-version }})
    needs: changes
    if: needs.changes.outputs.api_server == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: api-server/package-lock.json
      - run: cd api-server && npm ci
      - name: Run unit tests
        run: cd api-server && npm test
        env:
          NODE_ENV: test
          SKIP_SERVER_START: true
      - run: cd api-server && npm run lint || echo "Lint configuration needed"

  build-test:
    name: API Docker Build
    needs: [changes, security, test]
    # Only run when api-server changed AND both gating jobs passed
    if: |
      always() &&
      needs.changes.outputs.api_server == 'true' &&
      needs.security.result == 'success' &&
      needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./api-server
          push: false
          load: true
          tags: daonnetwork/api:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test Docker image
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          docker run --rm -d -p 3000:3000 --name api-test "daonnetwork/api:pr-${PR_NUMBER}"
          sleep 15
          curl -f http://localhost:3000/health || exit 1
          docker stop api-test

  # ── Blockchain ────────────────────────────────────────────────────────────

  blockchain-build-test:
    name: Blockchain Build
    needs: changes
    if: needs.changes.outputs.blockchain == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read the version from go.mod so this can never drift from it.
          go-version-file: daon-core/go.mod
      - name: Build blockchain binary
        # GOTOOLCHAIN=local matches the Docker builder, which cannot reach the
        # network to fetch a newer toolchain. Without it setup-go silently
        # downloads whatever go.mod asks for, so this job passes while the
        # release build fails -- exactly what happened on #98.
        env:
          GOTOOLCHAIN: local
        run: |
          cd daon-core
          go mod download
          make install || go build -o build/daon-cored ./cmd/daon-cored
      - name: Test blockchain binary
        run: cd daon-core && ./build/daon-cored version || echo "Binary created successfully"

  blockchain-docker-build:
    name: Blockchain Docker Build
    needs: [changes, blockchain-build-test]
    # Builds the real validator image from the same context deploy.yml uses, so
    # a Dockerfile, toolchain or dependency-resolution failure surfaces here
    # rather than after merge. deploy.yml only triggers on push to main, so
    # before this job existed the image was first built post-merge.
    #
    # amd64 only, deliberately. The release build does amd64 and arm64, but
    # arm64 runs under qemu and takes over 25 minutes for a cosmos-sdk chain --
    # go mod download and a full compile, emulated. Native amd64 takes minutes
    # and catches the same failures, all of which are architecture independent.
    # An arm64-only regression cannot reach production regardless: deploy.yml
    # gates deployment on its own multi-arch build, so it would fail there the
    # way #98 did, with nothing shipped.
    if: |
      always() &&
      needs.changes.outputs.blockchain == 'true' &&
      needs.blockchain-build-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build validator image
        uses: docker/build-push-action@v5
        with:
          context: ./daon-core
          platforms: linux/amd64
          push: false
          tags: daonnetwork/validator:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Frontend ──────────────────────────────────────────────────────────────

  frontend-test:
    name: Frontend Build & E2E
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: daon-frontend/package-lock.json
      - run: cd daon-frontend && npm ci
      - run: cd daon-frontend && npm run build
        env:
          NODE_ENV: production
      - run: cd daon-frontend && npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: cd daon-frontend && npx playwright test --project=chromium
        env:
          CI: true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: daon-frontend/playwright-report/
          retention-days: 30

  # ── SDK Tests ─────────────────────────────────────────────────────────────

  # ── Provenance ────────────────────────────────────────────────────────────

  provenance:
    name: Provenance (Rust)
    needs: changes
    if: needs.changes.outputs.provenance == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: provenance
    steps:
      - uses: actions/checkout@v4
      # No toolchain version here on purpose: provenance/rust-toolchain.toml is
      # the single source of truth, so CI cannot drift from a developer machine
      # the way go.mod and the Dockerfile did.
      # rustup reads provenance/rust-toolchain.toml and installs the pinned
      # channel with its components and targets. Naming components here instead
      # installed them for 'stable' while cargo used the pinned 1.97.1, so
      # cargo-fmt was missing for the toolchain that actually ran.
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: System libraries
        # The Linux credential store talks to Secret Service over D-Bus, and
        # `agentd` depends on the agent's keychain feature, so this is needed
        # before the first build rather than partway down the job.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev pkg-config

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all-features
      - name: Check the keychain backend compiles
        # Compiling is not the same as working: the #[ignore]d tests below are
        # what actually exercise a credential store, and they need a real one.
        run: cargo check -p daon-provenance-agent --features keychain
      - name: Tests without optional features
        # Steps 1-3 of the verifier must work without signature support, and a
        # build lacking it must fail closed rather than accept any signature.
        run: cargo test -p daon-provenance-verify --no-default-features --features std
      - name: Build the verifier for wasm32
        # Scoped to the verifier on purpose. Its value depends on a skeptic being
        # able to run it in a browser without trusting a binary we shipped, so
        # that crate must stay wasm-clean.
        #
        # Building the whole workspace here instead would fail, and for no useful
        # reason: agentd is a Unix-socket daemon that will never run in a
        # browser, and it pulls in getrandom, which refuses to compile for
        # wasm32-unknown-unknown without a JS shim. The constraint worth
        # enforcing is on the verifier, not on everything.
        run: cargo build -p daon-provenance-verify --target wasm32-unknown-unknown --release

      - name: Reference encoder self-check
        working-directory: .
        run: python3 scripts/provenance/wire_ref.py

      - name: Cross-implementation check
        working-directory: .
        # The decisive test. Each side's unit tests assert hardcoded values, so
        # both would keep passing if one drifted -- an implementation checking
        # itself proves nothing about a wire format. This diffs the two.
        run: |
          python3 scripts/provenance/emit_vectors.py > /tmp/py.txt
          (cd provenance && cargo run -q -p daon-provenance-core --example vectors) > /tmp/rs.txt
          if ! diff -u /tmp/py.txt /tmp/rs.txt; then
            echo "::error::Python reference and Rust crate disagree on the wire format."
            echo "::error::Every historic proof depends on these bytes. This is never a formatting nit."
            exit 1
          fi
          echo "$(wc -l < /tmp/py.txt) vectors agree byte-for-byte"

  # ── WordPress plugin ──────────────────────────────────────────────────────

  wordpress:
    name: WordPress Plugin Tests
    needs: changes
    if: needs.changes.outputs.wordpress == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wordpress-plugin/daon-creator-protection
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          # 8.4 because composer.lock resolves doctrine/instantiator at php ^8.4.
          # The plugin itself still declares php >=7.4 and that remains true --
          # the constraint is a dev dependency, so it binds the test suite only.
          php-version: '8.4'
          tools: composer
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      - name: Lint
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPUnit
        # The bootstrap stubs WordPress, so no WP install is required.
        run: composer test

  # ── creative-commons-chain ────────────────────────────────────────────────

  ccc-build:
    name: creative-commons-chain Build
    needs: changes
    if: needs.changes.outputs.ccc == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: creative-commons-chain/go.mod
      - name: Build
        env:
          GOTOOLCHAIN: local
        run: cd creative-commons-chain && go build ./...

  test-go:
    name: Go SDK Tests
    needs: changes
    if: needs.changes.outputs.sdk_go == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Run tests
        run: cd sdks/go && go test ./... -v

  test-node-sdk:
    name: Node.js SDK Tests
    needs: changes
    if: needs.changes.outputs.sdk_node == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdks/node/package-lock.json
      - run: cd sdks/node && npm ci
      - name: Run tests
        run: cd sdks/node && npm test

  test-python:
    name: Python SDK Tests
    needs: changes
    if: needs.changes.outputs.sdk_python == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests requests-mock pytest
      - name: Run tests
        run: cd sdks/python && PYTHONPATH=. pytest tests/ -v

  test-ruby:
    name: Ruby SDK Tests
    needs: changes
    if: needs.changes.outputs.sdk_ruby == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: sdks/ruby
      - name: Run tests
        run: cd sdks/ruby && bundle exec rspec spec/ --format documentation -I lib

  test-php:
    name: PHP SDK Tests
    needs: changes
    if: needs.changes.outputs.sdk_php == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none
      - run: cd sdks/php && composer install --no-interaction
      - name: Run tests
        run: cd sdks/php && vendor/bin/phpunit --testdox

  # ── Summary ───────────────────────────────────────────────────────────────

  # ── Provenance: the keychain, on a machine that has one ───────────────────

  provenance-keychain:
    name: Provenance (macOS keychain)
    needs: changes
    if: needs.changes.outputs.provenance == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: provenance
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Create a throwaway keychain
        # The ignored tests write real credentials, so they need a real keychain
        # -- but not the runner's login keychain, which is locked and which we
        # should not be adding secrets to anyway. A disposable one, made
        # default for the job, keeps the blast radius inside the runner.
        run: |
          security create-keychain -p "" ci.keychain
          security set-keychain-settings -lut 21600 ci.keychain
          security unlock-keychain -p "" ci.keychain
          security list-keychains -d user -s ci.keychain
          security default-keychain -s ci.keychain

      - name: Keychain tests
        # These are #[ignore] by default precisely because they touch the OS.
        # This is the one place they run.
        run: cargo test -p daon-provenance-agent --features keychain -- --ignored --test-threads=1

      - name: The daemon, on macOS
        # agentd is exercised on Linux by the main job; running it here too
        # catches anything that depends on Apple's socket or filesystem
        # behaviour rather than Linux's.
        run: cargo test -p daon-provenance-agentd

      - name: Report the resolved credential store
        # Not an assertion -- CI runs an unsigned binary, so this will report
        # FileKeychain. It is here so the value is visible in the log if the
        # signing story ever changes and nobody remembers to check.
        run: cargo run -p daon-provenance-agent --features keychain --example backend

      - name: Destroy the throwaway keychain
        if: always()
        run: security delete-keychain ci.keychain || true

  # ── Docs site ─────────────────────────────────────────────────────────────

  docs:
    name: Docs Site Build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      # The github-pages gem pins the exact Jekyll, plugin and Ruby versions
      # GitHub's builder uses, so a green run here means the real build works.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          # No Gemfile.lock is committed (the github-pages gem pins everything
          # transitively), so this resolves fresh each run rather than caching.
          bundler-cache: false
          working-directory: docs

      - name: Install gems
        run: bundle install --jobs 4

      - name: Build the site
        # --strict_front_matter turns malformed front matter into a failure
        # rather than a page that silently renders as raw YAML.
        run: bundle exec jekyll build --strict_front_matter --trace

      - name: Check internal links resolve
        # A page that links to a permalink which does not exist still builds
        # cleanly and simply 404s for whoever follows it, so the build alone
        # cannot catch this.
        #
        # 86 such links already existed when this check was added. They are
        # listed in .broken-links-baseline.txt rather than fixed here, because
        # blocking every docs change on a backlog of unwritten pages would just
        # get the check deleted. New breakage fails; the baseline can only
        # shrink.
        run: |
          grep -rhoE 'href="/[^"#?]*"' _site --include='*.html' \
            | sed -E 's/^href="//; s/"$//' | sort -u > /tmp/links.txt

          : > /tmp/broken.txt
          while IFS= read -r target; do
            case "$target" in
              /assets/*|/*.xml|/*.txt) continue ;;
            esac
            path="_site${target%/}"
            if [ ! -e "$path" ] && [ ! -e "$path/index.html" ] && [ ! -e "${path}.html" ]; then
              echo "$target" >> /tmp/broken.txt
            fi
          done < /tmp/links.txt

          grep -vE '^\s*(#|$)' .broken-links-baseline.txt | sort -u > /tmp/baseline.txt
          sort -u /tmp/broken.txt -o /tmp/broken.txt

          new_breaks=$(comm -23 /tmp/broken.txt /tmp/baseline.txt)
          now_fixed=$(comm -13 /tmp/broken.txt /tmp/baseline.txt)

          if [ -n "$now_fixed" ]; then
            echo "These baseline entries no longer break. Delete them from"
            echo ".broken-links-baseline.txt so it keeps shrinking:"
            echo "$now_fixed" | sed 's/^/  /'
          fi

          if [ -n "$new_breaks" ]; then
            echo "$new_breaks" | while read -r l; do
              echo "::error::broken internal link: $l"
            done
            exit 1
          fi

          echo "No new broken links ($(wc -l < /tmp/baseline.txt) known, unchanged)."

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs:
      - changes
      - security
      - test
      - build-test
      - blockchain-build-test
      - blockchain-docker-build
      - frontend-test
      - provenance
      - provenance-keychain
      - wordpress
      - ccc-build
      - docs
      - test-go
      - test-node-sdk
      - test-python
      - test-ruby
      - test-php
    if: always()
    steps:
      - name: PR Status Summary
        env:
          R_SECURITY:    ${{ needs.security.result }}
          R_TEST:        ${{ needs.test.result }}
          R_BUILD:       ${{ needs.build-test.result }}
          R_BLOCKCHAIN:  ${{ needs.blockchain-build-test.result }}
          R_BCDOCKER:    ${{ needs.blockchain-docker-build.result }}
          R_FRONTEND:    ${{ needs.frontend-test.result }}
          R_PROVENANCE:  ${{ needs.provenance.result }}
          R_PROVKEY:     ${{ needs.provenance-keychain.result }}
          R_WORDPRESS:   ${{ needs.wordpress.result }}
          R_CCC:         ${{ needs.ccc-build.result }}
          R_DOCS:        ${{ needs.docs.result }}
          R_GO:          ${{ needs.test-go.result }}
          R_NODE:        ${{ needs.test-node-sdk.result }}
          R_PYTHON:      ${{ needs.test-python.result }}
          R_RUBY:        ${{ needs.test-ruby.result }}
          R_PHP:         ${{ needs.test-php.result }}
        run: |
          render() {
            local label="$1" result="$2"
            case "$result" in
              success) echo "✅ **${label}**: passed"               >> "$GITHUB_STEP_SUMMARY" ;;
              skipped) echo "➖ **${label}**: skipped (no changes)" >> "$GITHUB_STEP_SUMMARY" ;;
              *)       echo "❌ **${label}**: FAILED (${result})"   >> "$GITHUB_STEP_SUMMARY" ;;
            esac
          }

          echo "## Pull Request Check Summary" >> "$GITHUB_STEP_SUMMARY"

          echo ""                              >> "$GITHUB_STEP_SUMMARY"
          echo "### API Server"                >> "$GITHUB_STEP_SUMMARY"
          render "Security Audit"   "$R_SECURITY"
          render "API Tests"        "$R_TEST"
          render "Docker Build"     "$R_BUILD"

          echo ""                              >> "$GITHUB_STEP_SUMMARY"
          echo "### Core"                      >> "$GITHUB_STEP_SUMMARY"
          render "Blockchain Build"        "$R_BLOCKCHAIN"
          render "Blockchain Docker Build" "$R_BCDOCKER"
          render "Frontend & E2E"          "$R_FRONTEND"
          render "creative-commons-chain"  "$R_CCC"

          echo ""                              >> "$GITHUB_STEP_SUMMARY"
          echo "### Provenance"                >> "$GITHUB_STEP_SUMMARY"
          render "Rust + cross-impl check" "$R_PROVENANCE"
          render "macOS keychain"          "$R_PROVKEY"

          echo ""                              >> "$GITHUB_STEP_SUMMARY"
          echo "### Integrations"              >> "$GITHUB_STEP_SUMMARY"
          render "WordPress Plugin" "$R_WORDPRESS"

          echo ""                              >> "$GITHUB_STEP_SUMMARY"
          echo "### Docs"                      >> "$GITHUB_STEP_SUMMARY"
          render "Docs Site Build" "$R_DOCS"

          echo ""                              >> "$GITHUB_STEP_SUMMARY"
          echo "### SDKs"                      >> "$GITHUB_STEP_SUMMARY"
          render "Go SDK"           "$R_GO"
          render "Node.js SDK"      "$R_NODE"
          render "Python SDK"       "$R_PYTHON"
          render "Ruby SDK"         "$R_RUBY"
          render "PHP SDK"          "$R_PHP"

          # Fail the summary job if any non-skipped job failed
          all_ok=true
          for result in "$R_SECURITY" "$R_TEST" "$R_BUILD" "$R_BLOCKCHAIN" "$R_BCDOCKER" \
                        "$R_FRONTEND" "$R_PROVENANCE" "$R_PROVKEY" "$R_WORDPRESS" "$R_CCC" "$R_DOCS" \
                        "$R_GO" "$R_NODE" "$R_PYTHON" "$R_RUBY" "$R_PHP"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              all_ok=false
            fi
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if $all_ok; then
            echo "**✅ All applicable checks passed.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**❌ One or more checks failed.**"    >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
