name: Auth E2E Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'daon-frontend/**'
      - 'api-server/**'
      - '.github/workflows/auth-e2e-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'daon-frontend/**'
      - 'api-server/**'

jobs:
  e2e-tests:
    name: E2E Authentication Tests
    runs-on: ubuntu-latest
    # Playwright's own image, matching the version in daon-frontend/package.json.
    # It ships chromium, firefox and webkit with every system library they need,
    # so nothing here calls apt -- which is what kept cancelling this job while
    # it waited on a dpkg lock held by unattended-upgrades.
    #
    # Pinned rather than floating: a browser build changing under CI without a
    # commit is the kind of drift that produces a failure nobody can reproduce.
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      # Docker gives a container 64 MB of /dev/shm by default, which a browser
      # exhausts almost immediately -- firefox died on launch with "Target page,
      # context or browser has been closed" for all 14 of its tests while
      # chromium's 28 passed. --ipc=host is what Playwright's own documentation
      # recommends for exactly this.
      options: --ipc=host
    # Raised from 15: the browser install alone consumed most of that budget,
    # so a slow network cancelled the run before a single test executed.
    timeout-minutes: 25
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: daon_db
          POSTGRES_USER: daon_user
          POSTGRES_PASSWORD: daon_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daon_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      mailhog:
        image: mailhog/mailhog
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if frontend exists
        id: check_frontend
        run: |
          if [ -d "daon-frontend" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Frontend directory not found, skipping E2E tests"
            exit 0
          fi

      - name: Setup Node.js
        if: steps.check_frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            api-server/package-lock.json
            daon-frontend/package-lock.json

      - name: Install API server dependencies
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./api-server
        run: npm ci

      - name: Build API server
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./api-server
        run: npm run build

      - name: Install frontend dependencies
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./daon-frontend
        run: npm ci

      # A pinned container tag drifts the moment package.json moves. Checked
      # here rather than discovered as a mysterious behaviour difference between
      # a developer's machine and CI.
      - name: Container image must match the Playwright version
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./daon-frontend
        run: |
          want=$(node -p "require('@playwright/test/package.json').version")
          have="1.57.0"
          if [ "$want" != "$have" ]; then
            echo "::error::playwright is $want but the container is pinned to $have"
            echo "Update the container image tag in .github/workflows/auth-e2e-tests.yml"
            exit 1
          fi
          echo "  container matches playwright $want"

      # The Playwright image has browsers, not a postgres client. apt is fine
      # here: the dpkg lock that unattended-upgrades holds is on the runner
      # host, and this runs inside a container that has neither.
      - name: Install postgres client
        if: steps.check_frontend.outputs.exists == 'true'
        run: |
          apt-get update -qq
          apt-get install -y -qq postgresql-client

      - name: Setup database schema
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./api-server
        env:
          DB_HOST: postgres
          DB_PORT: 5432
          DB_NAME: daon_db
          DB_USER: daon_user
          DB_PASSWORD: daon_test_password
        run: |
          PGPASSWORD=daon_test_password psql -h postgres -U daon_user -d daon_db -f src/database/schema.sql

      - name: Start API server
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./api-server
        env:
          NODE_ENV: test
          START_SERVER: 'true'
          PORT: 3000
          DATABASE_URL: postgresql://daon_user:daon_test_password@postgres:5432/daon_db
          DB_HOST: postgres
          DB_PORT: 5432
          DB_NAME: daon_db
          DB_USER: daon_user
          DB_PASSWORD: daon_test_password
          JWT_ACCESS_SECRET: test_access_secret_key_min_32_chars_long
          JWT_REFRESH_SECRET: test_refresh_secret_key_min_32_chars_long
          SMTP_HOST: mailhog
          SMTP_PORT: 1025
          SMTP_FROM: noreply@daon.network
          SMTP_USER: ''
          SMTP_PASS: ''
          TOTP_ISSUER: DAON
          FRONTEND_URL: http://localhost:4000
        run: |
          npm start &
          echo $! > /tmp/api-server.pid
          # Wait for API to be ready
          timeout 30 bash -c 'until curl -f http://localhost:3000/api/v1/health; do sleep 1; done'

      - name: Run E2E tests
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./daon-frontend
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://localhost:3000
        # All three browsers, webkit included -- the container has its
        # libraries, which is the whole reason for using it.
        run: npx playwright test

      - name: Upload test results
        if: always() && steps.check_frontend.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: daon-frontend/playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        if: failure() && steps.check_frontend.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: daon-frontend/test-results/
          retention-days: 7

      - name: Stop servers
        if: always() && steps.check_frontend.outputs.exists == 'true'
        run: |
          [ -f /tmp/api-server.pid ] && kill $(cat /tmp/api-server.pid) || true
