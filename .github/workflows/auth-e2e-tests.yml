name: Auth E2E Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'daon-frontend/**'
      - 'api-server/**'
      - '.github/workflows/auth-e2e-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'daon-frontend/**'
      - 'api-server/**'

jobs:
  e2e-tests:
    name: E2E Authentication Tests
    runs-on: ubuntu-latest
    # Raised from 15: the browser install alone consumed most of that budget,
    # so a slow network cancelled the run before a single test executed.
    timeout-minutes: 25
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: daon_db
          POSTGRES_USER: daon_user
          POSTGRES_PASSWORD: daon_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daon_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      mailhog:
        image: mailhog/mailhog
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if frontend exists
        id: check_frontend
        run: |
          if [ -d "daon-frontend" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Frontend directory not found, skipping E2E tests"
            exit 0
          fi

      - name: Setup Node.js
        if: steps.check_frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            api-server/package-lock.json
            daon-frontend/package-lock.json

      - name: Install API server dependencies
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./api-server
        run: npm ci

      - name: Build API server
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./api-server
        run: npm run build

      - name: Install frontend dependencies
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./daon-frontend
        run: npm ci

      # Browsers are ~400 MB and unchanged between runs. Keyed on the resolved
      # Playwright version, so an upgrade fetches fresh ones and nothing else
      # does.
      - name: Resolve Playwright version
        id: pw
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: daon-frontend
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        if: steps.check_frontend.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}

      # System libraries for webkit -- libavif, libharfbuzz-icu, libsecret,
      # libhyphen, libwayland-server and friends. Chromium and firefox run on
      # the bare runner image; webkit does not, and without these its 14 tests
      # fail on a wall of missing .so files.
      #
      # Not cacheable: these are apt packages installed system-wide, not files
      # under ~/.cache, so this runs even when the browser cache hits.
      - name: System libraries for webkit
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./daon-frontend
        # unattended-upgrades holds the dpkg lock on GitHub runners and apt waits
        # on it indefinitely. That is what wedged this job into a 15-minute
        # cancellation, and the same lock hung the Rust job for an hour. Stopping
        # it first makes the wait bounded rather than indefinite.
        run: |
          sudo systemctl stop unattended-upgrades.service 2>/dev/null || true
          sudo systemctl stop apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          sudo killall -q apt-get apt 2>/dev/null || true
          npx playwright install-deps webkit

      - name: Install Playwright browsers
        if: steps.check_frontend.outputs.exists == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: ./daon-frontend
        # Browser binaries only; system libraries are the step above. Split so
        # this half can be cached and so a slow apt cannot cancel the job before
        # a single test runs.
        run: npx playwright install chromium webkit firefox

      - name: Setup database schema
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./api-server
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: daon_db
          DB_USER: daon_user
          DB_PASSWORD: daon_test_password
        run: |
          PGPASSWORD=daon_test_password psql -h localhost -U daon_user -d daon_db -f src/database/schema.sql

      - name: Start API server
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./api-server
        env:
          NODE_ENV: test
          START_SERVER: 'true'
          PORT: 3000
          DATABASE_URL: postgresql://daon_user:daon_test_password@localhost:5432/daon_db
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: daon_db
          DB_USER: daon_user
          DB_PASSWORD: daon_test_password
          JWT_ACCESS_SECRET: test_access_secret_key_min_32_chars_long
          JWT_REFRESH_SECRET: test_refresh_secret_key_min_32_chars_long
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          SMTP_FROM: noreply@daon.network
          SMTP_USER: ''
          SMTP_PASS: ''
          TOTP_ISSUER: DAON
          FRONTEND_URL: http://localhost:4000
        run: |
          npm start &
          echo $! > /tmp/api-server.pid
          # Wait for API to be ready
          timeout 30 bash -c 'until curl -f http://localhost:3000/api/v1/health; do sleep 1; done'

      - name: Run E2E tests
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./daon-frontend
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://localhost:3000
        run: npx playwright test

      - name: Upload test results
        if: always() && steps.check_frontend.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: daon-frontend/playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        if: failure() && steps.check_frontend.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: daon-frontend/test-results/
          retention-days: 7

      - name: Stop servers
        if: always() && steps.check_frontend.outputs.exists == 'true'
        run: |
          [ -f /tmp/api-server.pid ] && kill $(cat /tmp/api-server.pid) || true
